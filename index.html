<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kiki The Designer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Caveat:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(180deg,#fff9f6,#f9ece5);

color:#7a4735;

overflow:hidden;

}

/* Soft Background */

body::before{

content:"";

position:fixed;

inset:0;

pointer-events:none;

opacity:.07;

background-image:
radial-gradient(#b57962 .7px,transparent .7px);

background-size:12px 12px;

}

/* Navbar */

header{

position:fixed;

top:25px;

left:50%;

transform:translateX(-50%);

width:90%;

max-width:1200px;

display:flex;

justify-content:space-between;

align-items:center;

padding:16px 35px;

background:rgba(255,255,255,.65);

backdrop-filter:blur(15px);

border-radius:60px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

z-index:1000;

}

.logo{

display:flex;

align-items:center;

gap:15px;

}

.logo img{

width:58px;

height:58px;

border-radius:50%;

}

.logo h3{

font-size:28px;

font-weight:700;

color:#8d4f3a;

}

nav{

display:flex;

gap:40px;

}

nav a{

text-decoration:none;

color:#704333;

font-weight:600;

transition:.3s;

}

nav a:hover{

color:#b96b4d;

}

/* Hero */

.hero{

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:0 20px;

}

.hero h1{

font-family:'League Spartan',sans-serif;

font-size:220px;

line-height:.82;

letter-spacing:-10px;

color:#9d543d;

}

.hero h2{

font-family:'Caveat',cursive;

font-size:72px;

margin-top:-12px;

color:#7a4735;

}

.hero p{

font-size:20px;

margin-top:20px;

max-width:650px;

line-height:1.8;

}

.buttons{

margin-top:45px;

display:flex;

gap:20px;

flex-wrap:wrap;

justify-content:center;

}

.btn{

padding:18px 40px;

background:#9d543d;

color:white;

text-decoration:none;

border-radius:50px;

font-weight:600;

transition:.35s;

}

.btn:hover{

transform:translateY(-5px);

box-shadow:0 18px 30px rgba(157,84,61,.25);

}

.btn2{

background:white;

color:#9d543d;

border:2px solid #9d543d;

}

.btn2:hover{

background:#9d543d;

color:white;

}

/* Logo */

.hero-logo{

margin-top:40px;

}

.hero-logo img{

width:140px;

animation:float 5s ease-in-out infinite;

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}

}

/* Scroll */

.scroll{

position:absolute;

bottom:35px;

left:50%;

transform:translateX(-50%);

font-size:13px;

letter-spacing:5px;

font-weight:600;

color:#7a4735;

animation:bounce 2s infinite;

}

@keyframes bounce{

0%{transform:translate(-50%,0);}
50%{transform:translate(-50%,-10px);}
100%{transform:translate(-50%,0);}

}

/* Mobile */

@media(max-width:900px){

.hero h1{

font-size:110px;

letter-spacing:-5px;

}

.hero h2{

font-size:48px;

}

.hero p{

font-size:17px;

}

nav{

display:none;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

<img src="logo.png" alt="Logo">

<h3>Kiki</h3>

</div>

<nav>

<a href="#">Home</a>

<a href="#">Portfolio</a>

<a href="#">About</a>

<a href="#">Contact</a>

</nav>

</header>

<section class="hero">

<h1>KIKI</h1>

<h2>the designer</h2>

<p>

Graphic Designer • Brand Identity • Packaging • Print Design • Social Media Creative

</p>

<div class="buttons">

<a href="#" class="btn">

View Portfolio

</a>

<a href="#" class="btn btn2">

Hire Me

</a>

</div>

<div class="hero-logo">

<img src="logo.png" alt="Kiki Logo">

</div>

<div class="scroll">

SCROLL DOWN

</div>

</section>

</body>
</html>
