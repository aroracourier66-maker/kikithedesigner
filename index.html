<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kiki | The Designer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;500;700;800&family=Caveat:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

:root{

--bg:#FFF8F4;
--text:#5b392d;
--primary:#A25D43;
--light:#EFD9D0;
--white:#ffffff;

}

body{

font-family:Poppins,sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;

}

body::before{

content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:.05;

background-image:
radial-gradient(#b67c67 .8px,transparent .8px);

background-size:12px 12px;

}

/* HEADER */

header{

position:fixed;
top:0;
left:0;
width:100%;
padding:30px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,248,244,.88);
backdrop-filter:blur(10px);
z-index:999;

}

.logo{

display:flex;
align-items:center;
gap:14px;

}

.logo img{

width:58px;
height:58px;
border-radius:50%;

}

.logo span{

font-size:25px;
font-weight:600;

}

nav{

display:flex;
gap:45px;

}

nav a{

text-decoration:none;
color:var(--text);
font-weight:500;
position:relative;

}

nav a::after{

content:"";
position:absolute;
left:0;
bottom:-5px;
width:0;
height:2px;
background:var(--primary);
transition:.35s;

}

nav a:hover::after{

width:100%;

}

/* HERO */

.hero{

height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:0 30px;

}

.hero h1{

font-family:'League Spartan',sans-serif;
font-size:230px;
line-height:.82;
letter-spacing:-10px;
color:var(--primary);

}

.hero h2{

font-family:'Caveat',cursive;
font-size:60px;
margin-top:-15px;

}

.hero p{

margin-top:35px;
max-width:700px;
line-height:1.9;
font-size:20px;

}

.button{

display:inline-flex;
align-items:center;
gap:12px;
margin-top:45px;
font-weight:600;
text-decoration:none;
color:var(--primary);
font-size:18px;
transition:.3s;

}

.button::after{

content:"→";
transition:.3s;

}

.button:hover{

transform:translateY(-3px);

}

.button:hover::after{

transform:translateX(8px);

}

.scroll{

position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
letter-spacing:6px;
font-size:12px;
animation:bounce 2s infinite;

}

@keyframes bounce{

0%,100%{

transform:translate(-50%,0);

}

50%{

transform:translate(-50%,-10px);

}

}

/* SECTION */

section{

padding:120px 8%;

}

.section-title{

text-align:center;
margin-bottom:80px;

}

.section-title p{

letter-spacing:4px;
text-transform:uppercase;
color:var(--primary);
font-size:14px;

}

.section-title h2{

font-family:'League Spartan';
font-size:70px;
margin-top:15px;

}

@media(max-width:900px){

.hero h1{

font-size:110px;
letter-spacing:-4px;

}

.hero h2{

font-size:42px;

}

.hero p{

font-size:17px;

}

nav{

display:none;

}

.section-title h2{

font-size:45px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

<img src="2 logo.png" alt="Kiki Logo">

<span>Kiki</span>

</div>

<nav>

<a href="#">Portfolio</a>

<a href="#">About</a>

<a href="#">Services</a>

<a href="#">Contact</a>

</nav>

</header><!-- HERO -->

<section class="hero">

    <h1>KIKI</h1>

    <h2>the designer</h2>

    <p>
        Creating elegant visual identities,
        luxury packaging, print design and
        modern branding experiences.
    </p>

    <div class="hero-buttons">

        <a href="#" class="button">
            VIEW PORTFOLIO
        </a>

        <a href="#" class="button secondary">
            CONTACT ME
        </a>

    </div>

    <div class="scroll">

        <span></span>

        <p>SCROLL</p>

    </div>

</section>

<style>

/* HERO BUTTONS */

.hero-buttons{

display:flex;
gap:20px;
margin-top:45px;

}

.button{

padding:18px 38px;
border-radius:50px;
background:var(--primary);
color:#fff;
text-decoration:none;
font-weight:600;
transition:.35s;

}

.button:hover{

transform:translateY(-5px);

}

.button.secondary{

background:transparent;
color:var(--primary);
border:2px solid var(--primary);

}

.button.secondary:hover{

background:var(--primary);
color:#fff;

}

/* SCROLL */

.scroll{

position:absolute;
bottom:35px;
left:50%;
transform:translateX(-50%);
display:flex;
flex-direction:column;
align-items:center;
gap:12px;

}

.scroll span{

width:2px;
height:55px;
background:var(--primary);
animation:scroll 1.8s infinite;

}

.scroll p{

font-size:12px;
letter-spacing:5px;
font-weight:600;
color:var(--primary);

}

@keyframes scroll{

0%{

height:20px;
opacity:.2;

}

50%{

height:55px;
opacity:1;

}

100%{

height:20px;
opacity:.2;

}

}

/* RESPONSIVE */

@media(max-width:900px){

.hero{

padding:0 25px;

}

.hero-buttons{

flex-direction:column;
width:100%;
max-width:300px;

}

.button{

text-align:center;

}

.hero h1{

font-size:110px;

}

.hero h2{

font-size:42px;

}

.hero p{

font-size:17px;

}

}

</style>

</body>

</html>
