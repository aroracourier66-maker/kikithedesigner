<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kiki The Designer</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
    color:#8B4B36;
    overflow-x:hidden;

    background:
        radial-gradient(circle at top left,
            rgba(255,214,200,.35),
            transparent 35%),

        radial-gradient(circle at bottom right,
            rgba(240,180,160,.20),
            transparent 35%),

        linear-gradient(
            135deg,
            #FFF8F5 0%,
            #FCEEE8 40%,
            #F8E4DC 100%
        );
}

body::before{

content:"";

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

opacity:.08;

background-image:
radial-gradient(#9d543d 0.6px, transparent 0.6px);

background-size:10px 10px;

mix-blend-mode:multiply;

}

</style>

</head>

<body>

<h1>Hello Kiki</h1>

</body>

</html>
